<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>嗨！來上課 HILAI CLASS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 工具型後台 — 上方分頁列，左列課程、右側明細；投影頁與學員頁各自全幅單欄 */
/* 配色依 GRAND HILAI 品牌 CI（企-112-058）：標準色 黑 K100、品牌褐灰 PANTONE 409 C（R150 G133 B118）及其 10%–100% 色階 */
:root{
  --bg:#F5F3F1; --surface:#FFFFFF; --ink:#000000; --muted:#6B635C; --line:#E0DAD6;
  --jade:#000000; --jade-soft:#EAE7E4; --brass:#968576; --brass-soft:#F0ECE8; --brass-ink:#6E6052;
  --ok:#3F6B4E; --warn:#9A5B12; --warn-soft:#F7ECDD; --bad:#A8352C; --bad-soft:#F6E2DF;
  --chip:#F2EFEC;
  --f-display:"Helvetica Neue","Huninn","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Helvetica Neue","Huninn","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121110; --surface:#1C1A19; --ink:#F2EFEC; --muted:#A39A92; --line:#34302D;
  --jade:#F2EFEC; --jade-soft:#2E2A27; --brass:#B9AA9C; --brass-soft:#2A2521; --brass-ink:#CDBFB2;
  --ok:#7FB38F; --warn:#E0A55A; --warn-soft:#352715; --bad:#EE7C72; --bad-soft:#3A1E1C; --chip:#262321; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1C1A19; --ink:#F2EFEC; --muted:#A39A92; --line:#34302D;
  --jade:#F2EFEC; --jade-soft:#2E2A27; --brass:#B9AA9C; --brass-soft:#2A2521; --brass-ink:#CDBFB2;
  --ok:#7FB38F; --warn:#E0A55A; --warn-soft:#352715; --bad:#EE7C72; --bad-soft:#3A1E1C; --chip:#262321; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3;font-weight:400}
.wrap{max-width:1160px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted)}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:22px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-family:var(--f-display);font-size:24px;letter-spacing:.02em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.brand .brand-en{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;letter-spacing:.32em;color:var(--brass)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:8px;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--jade-soft);color:var(--jade)}
.banner{margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--jade)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field select,input.in,select.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
.field input:focus,.field select:focus,input.in:focus{border-color:var(--jade);outline:none}
.grid-form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 14px}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:span 4}.span6{grid-column:span 6}
@media (max-width:720px){.grid-form{grid-template-columns:repeat(2,minmax(0,1fr))}.span3,.span4,.span6{grid-column:span 2}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative;align-self:flex-start}
.field input[type=checkbox],.field input[type=radio]{width:auto}
.seg label{padding:7px 14px;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--jade-soft);color:var(--jade);font-weight:500}

/* layout */
main{padding-top:20px}
.split{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.panel h2{font-size:17px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}

/* course list */
.clist{display:flex;flex-direction:column;gap:2px}
.citem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:8px;width:100%}
.citem:hover{background:var(--chip)}
.citem[aria-current="true"]{background:var(--jade-soft)}
.citem .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .m{grid-column:1;font-size:12px;color:var(--muted)}
.citem .n{grid-row:1/3;grid-column:2;align-self:center;text-align:right;font-size:12px;color:var(--muted)}
.citem .n b{display:block;font-size:18px;color:var(--ink);font-family:var(--f-mono)}
.group-h{font-size:12px;letter-spacing:.06em;color:var(--muted);padding:12px 12px 4px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.open{background:var(--jade-soft);color:var(--jade)}
.chip.open::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.brass{background:var(--brass-soft);color:var(--brass-ink)}

/* detail */
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 18px;margin:14px 0 4px}
.dl div{min-width:0}
.dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.dl dt{font-size:12px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;font-weight:500;color:var(--muted);background:var(--chip)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:16px;margin-bottom:6px}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--chip);border-radius:8px;padding:6px 6px 6px 12px;min-width:0}
.linkbox code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-mono);font-size:12px}
.stat-row{display:flex;gap:24px;flex-wrap:wrap;margin-top:6px}
.stat b{font-family:var(--f-mono);font-size:26px;display:block;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}

/* roster cards */
.sites{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.site{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.site b{font-family:var(--f-mono);font-size:24px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}

/* projector */
.proj{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:4vw;align-items:center;max-width:1400px;margin:0 auto;padding-block:4vh}
@media (max-width:800px){.proj{grid-template-columns:minmax(0,1fr)}}
.proj .site-name{color:var(--brass);letter-spacing:.12em;font-size:clamp(14px,1.4vw,20px)}
.proj h1{font-family:var(--f-display);font-size:clamp(28px,3.6vw,56px);margin:8px 0 14px}
.proj .when{font-size:clamp(15px,1.5vw,22px);color:var(--muted)}
.proj .hint{margin-top:4vh;font-size:clamp(16px,1.7vw,26px)}
.proj .count{margin-top:3vh;display:flex;align-items:baseline;gap:10px}
.proj .count b{font-family:var(--f-mono);font-size:clamp(40px,5vw,80px);color:var(--jade);line-height:1}
.recent{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;min-height:30px}
.recent span{background:var(--jade-soft);color:var(--jade);border-radius:999px;padding:2px 12px;font-size:clamp(13px,1.1vw,17px);animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.recent span{animation:none}.bar i{transition:none}}
.qrcard{background:#FFFFFF;border-radius:20px;padding:clamp(16px,2vw,32px);box-shadow:0 10px 40px rgba(60,45,30,.12);justify-self:center;width:min(100%,62vh)}
.qrcard svg{display:block;width:100%;height:auto}
.qrcard .bar{height:6px;background:#EAE7E4;border-radius:3px;margin-top:14px;overflow:hidden}
.qrcard .bar i{display:block;height:100%;background:#968576;transition:width 1s linear}
.qrcard .cap{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:#6B635C}
.exp-cta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin-top:12px;padding:16px 18px;border:2px dashed var(--jade);border-radius:12px;background:var(--jade-soft)}
.exp-cta b{font-size:16px;color:var(--jade)}
.exp-cta .btn{padding:10px 18px;font-size:15px}
.qrcard .pin{display:flex;align-items:baseline;justify-content:center;gap:12px;margin-top:10px;color:#6B635C;font-size:clamp(14px,1.3vw,18px)}
.qrcard .pin b{color:#000000;font-size:clamp(30px,3.4vw,52px);letter-spacing:.08em}
.stu .pick{display:flex;flex-direction:column;gap:8px}
.stu .pick button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px}
.stu .pick button[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft)}
.stu .foot{text-align:center;margin-top:18px}
.stu .foot button{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px}
.closed-card{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#6B635C;gap:8px;padding:10%}
.closed-card b{font-size:clamp(20px,2.4vw,34px);color:#000000;font-family:var(--f-display)}
.proj-tools{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:6px;opacity:.35;transition:opacity .2s}
.proj-tools:hover,.proj-tools:focus-within{opacity:1}

/* student */
.stu{max-width:440px;margin:0 auto;padding-block:28px}
.stu .site-name{color:var(--brass);letter-spacing:.12em;font-size:13px}
.stu h1{font-family:var(--f-display);font-size:24px;margin:4px 0 4px}
.stu .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:20px}
.stu .big-in{font-family:var(--f-mono);font-size:22px;letter-spacing:.08em;padding:12px 14px;text-transform:uppercase}
.stu .btn{justify-content:center;padding:12px 16px;font-size:16px}
.stu .who{font-size:26px;font-weight:700;margin:4px 0}
.stu .done{text-align:center}
.stu .done .mark{width:72px;height:72px;border-radius:50%;background:var(--jade-soft);color:var(--jade);display:grid;place-items:center;margin:0 auto 10px;font-size:38px}
.stu .msg{padding:12px 14px;border-radius:10px;font-size:14px;margin-top:12px}
.stu .msg.warn{background:var(--warn-soft);color:var(--warn)}
.stu .msg.bad{background:var(--bad-soft);color:var(--bad)}
.stack{display:flex;flex-direction:column;gap:12px}
.stu .info{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
.stu .info b{color:var(--ink);font-weight:500}
.ill{display:block;color:var(--brass);flex:none}
.ill .soft{fill:var(--brass-soft)}
.ill .solid{fill:currentColor;stroke:none}
.ill text{fill:currentColor;stroke:none;font-family:var(--f-body)}
.stu .done .ill{margin:0 auto 6px}
.stu .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.empty-ill{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--muted);padding:6px 0}
.empty-ill b{color:var(--ink);font-weight:400;font-size:17px}
@media (prefers-reduced-motion:no-preference){.stu .done .ill{animation:pop .5s ease-out}}
.stu .done .mark.wait{background:var(--brass-soft);color:var(--brass);font-size:26px;font-weight:700}
.stu .done .status{font-size:20px;font-weight:700;margin-top:2px}
.stu .ticket{border-top:1px dashed var(--line);margin:16px 0 0;padding-top:12px;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px}
.stu .ticket dt{color:var(--muted)}
.stu .ticket dd{margin:0;overflow-wrap:anywhere}
.stu .foot a{color:var(--muted);font-size:13px}
.stu .shot{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--jade-soft);color:var(--jade);font-size:14px;text-align:center}
.reg-qr{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--chip)}
.reg-qr .svgbox{width:132px;background:#fff;border-radius:8px;padding:6px;border:1px solid var(--line)}
.reg-qr .svgbox svg{display:block;width:100%;height:auto}
.reg-qr .stack{flex:1;min-width:220px;gap:8px}

/* 品牌標誌：使用官方檔，不改色、不變形；深色底依 CI 反白 */
.logo{display:block;height:auto;aspect-ratio:575/276}
.logo-wrap{display:flex;justify-content:center;padding:4px 0 22px}
.logo-wrap .logo{width:132px}
.brand-row{display:flex;align-items:center;gap:20px}
.brand-row .logo{width:104px;flex:none}
.brand-row .divider{width:1px;align-self:stretch;background:var(--line)}
.proj .logo{width:clamp(120px,11vw,180px);margin-bottom:3vh}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{filter:brightness(0) invert(1)}}
:root[data-theme="dark"] .logo{filter:brightness(0) invert(1)}
@media (max-width:520px){.brand-row .logo{width:84px}.brand-row{gap:14px}}
.userbar{display:flex;justify-content:flex-end;align-items:center;gap:12px;flex-wrap:wrap;padding-top:12px;font-size:13px;color:var(--muted)}
.userbar b{color:var(--ink)}
a.btn{text-decoration:none;color:inherit}
.qr-preview{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--chip)}
.qr-preview img{width:180px;max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:#fff}
.qr-preview .stack{flex:1;min-width:200px;gap:6px}
a.btn.primary{color:var(--surface)}
</style>
</head>
<body>
<div id="app"><div class="stu"><div class="card">載入中…</div></div></div>
<div id="toast" class="toast" hidden></div>

      for (var r = 8; r < _moduleCount - 8; r += 1) {

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

              bytes.push(b & 0xff);

          }
        }

/* ===== 小工具 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const toInputDate = s => (s||"").replace(/\//g,"-");
const fromInputDate = s => (s||"").replace(/-/g,"/");
const minOf = t => { const [h,m] = String(t||"0:0").split(":").map(Number); return h*60+(m||0); };
const addMin = (t,d) => { let v = Math.max(0, Math.min(1439, minOf(t)+d)); return `${pad(Math.floor(v/60))}:${pad(v%60)}`; };
const normEmp = s => String(s ?? "").trim().toUpperCase().replace(/\s+/g,"");
const creditOf = h => Math.floor((Number(h)||0)*2)/2;   // 每 30 分鐘 0.5 學分
const prevDay = d => { const [y,m,dd]=String(d).split("/").map(Number); const t=new Date(Date.UTC(y,m-1,dd-1)); return `${t.getUTCFullYear()}/${pad(t.getUTCMonth()+1)}/${pad(t.getUTCDate())}`; };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const rid = (n=8) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => "abcdefghjkmnpqrstuvwxyz23456789"[b%31]).join("");
function lsGet(k){ try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch {} }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3000); }
async function copyText(text){ try { await navigator.clipboard.writeText(text); toast("已複製"); } catch { toast("無法自動複製，請手動選取"); } }
const errMsg = e => String((e && e.message) || e || "發生錯誤").replace(/^(Exception|Error):\s*/,"");
const STATUS_CHIP = { upcoming:'<span class="chip">未開放</span>', open:'<span class="chip open">簽到中</span>', ended:'<span class="chip">已結束</span>' };
const ROLES = { owner:"總管理者", hr:"系統管理員", company:"部門小幫手" };

/* ===== 呼叫伺服器 ===== */
async function api(fn, ...args){
  if (!/^https?:\/\//.test(API_URL)) throw new Error("網頁還沒設定 Apps Script 網址，請洽系統管理員");
  let r;
  try {
    r = await fetch(API_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({fn, args}), redirect:"follow" });
  } catch(e){ throw new Error("網路連線失敗，請確認網路後再試一次"); }
  let j;
  try { j = await r.json(); } catch(e){ throw new Error("伺服器暫時沒有回應，請稍後再試"); }
  if (j && j.err !== undefined) throw new Error(j.err);
  return j ? j.val : null;
}

async function apiRetry(fn, ...args){
  for (let i=0;i<3;i++){
    try { return await api(fn, ...args); }
    catch(e){ const m=errMsg(e); if (i<2 && /忙碌|NetworkError|網路|timed out|timeout|Service invoked too many/i.test(m)){ await sleep(700+Math.random()*1300); continue; } throw e; }
  }
}

  const url=URL.createObjectURL(blob); const a=document.createElement("a");

  setTimeout(()=>URL.revokeObjectURL(url), 10000);
}

async function call(fn, ...args){

async function refresh(withDetail){
  S.data = await call("getAdminData"); S.user = S.data.user;
  if (!S.exportFrom){ const t=S.data.today; S.exportFrom=t.slice(0,8)+"01"; S.exportTo=t; }
  if (withDetail!==false && S.selected) await loadDetail(S.selected).catch(()=>{});
}
async function loadDetail(cid){ S.detail = localizeDetail(await call("getCourseDetail", cid)); }
function softRender(){
  const a=document.activeElement;
  if (a && a.matches("input,select,textarea") && a.closest("form[data-form]") && !a.closest("form[data-form=manual],form[data-form=reg-add],form[data-form=export-filter]")){ S.dirty=true; return; }
  S.dirty=false; renderAdmin();
}
document.addEventListener("focusout", ()=>{ if (S.dirty) setTimeout(()=>{ if (S.dirty) softRender(); },0); });

function renderAdmin(){
  if (S.projecting) return;
  const app=$("#app"); const keep=window.scrollY;
  const draftEl=$("#exp-text"), draft=draftEl?.value;
  if (!S.token || !S.user || S.user.mustChange){ app.innerHTML=viewAuth(); $("#app input")?.focus(); return; }
  const tabs=[["courses","課程與簽到"], ...(isHr()?[["roster","在職名單"]]:[]), ["export","匯出"], ...(isOwner()?[["accounts","帳號管理"]]:[]), ...(isHr()?[["log","操作紀錄"]]:[]), ["me","我的帳號"]];
  if (!tabs.some(([k])=>k===S.tab)) S.tab="courses";
  const u=S.user;
  app.innerHTML=`<div class="wrap">
    <div class="userbar"><span><b>${esc(u.name)}</b>（${esc(u.account)}）｜${esc(u.roleName)}${u.role==="company"?"："+esc(u.companies.join("、")):""}</span><button class="btn sm" data-act="logout">登出</button></div>
    <header class="top">
      <div class="brand-row">${LOGO_IMG}<span class="divider"></span><div class="brand"><h1>嗨！來上課</h1><p class="brand-en">HILAI CLASS</p></div></div>
      <nav class="tabs" role="tablist">${tabs.map(([k,v])=>`<button class="tab" role="tab" aria-selected="${S.tab===k}" data-tab="${k}">${v}</button>`).join("")}</nav>
    </header>
    <main>${S.tab==="courses"?viewCourses(): S.tab==="roster"?viewRoster(): S.tab==="export"?viewExport(): S.tab==="accounts"?viewAccounts(): S.tab==="log"?viewLog(): viewMe()}</main>
  </div>`;
  const ne=$("#exp-text"); if (ne && draft!=null) ne.value=draft;
  const qi=$("#qr-preview"); if (qi && S.detail) qi.src=qrPreviewUrl(S.detail);
  const ri=$("#reg-preview"); if (ri && S.detail) ri.src=qrPreviewUrl(S.detail, "reg");
  window.scrollTo(0,keep);
}

/* ---------- 登入 ---------- */
function authShell(title, sub, body){ return `<div class="stu" style="max-width:420px">${LOGO_TOP}<div class="site-name">嗨！來上課 HILAI CLASS｜管理後台</div><h1>${title}</h1><div class="small muted">${sub}</div><div class="card">${body}</div></div>`; }
function chpwForm(){ return `<form class="stack" data-form="chpw" autocomplete="off">
    <label class="label" for="cp-old">目前密碼</label><input id="cp-old" name="old" type="password" class="in" required>
    <label class="label" for="cp-pw">新密碼（至少 8 個字元）</label><input id="cp-pw" name="pw" type="password" class="in" required>
    <label class="label" for="cp-pw2">再輸入一次新密碼</label><input id="cp-pw2" name="pw2" type="password" class="in" required>
    <button class="btn primary">更新密碼</button></form>`; }
function viewAuth(){
  if (!S.hasAdmins) return authShell("建立總管理者", "系統還沒有任何管理員。第一個建立的帳號會成為總管理者，可以指定其他人的權限。",
    `<form class="stack" data-form="setup" autocomplete="off">
      <label class="label" for="su-acc">帳號（建議用工號）</label><input id="su-acc" name="account" class="in mono" required>
      <label class="label" for="su-name">姓名</label><input id="su-name" name="name" class="in" required>
      <label class="label" for="su-pw">密碼（至少 8 個字元）</label><input id="su-pw" name="pw" type="password" class="in" required>
      <label class="label" for="su-pw2">再輸入一次密碼</label><input id="su-pw2" name="pw2" type="password" class="in" required>
      <button class="btn primary">建立並登入</button></form>`);
  if (S.user?.mustChange) return authShell("請設定新密碼", `${esc(S.user.name)}，你目前使用的是臨時密碼，請先設定自己的密碼。`, chpwForm());
  return authShell("管理員登入", "學員簽到不需要登入，請直接掃描教室裡的 QR Code。",
    `<form class="stack" data-form="login" autocomplete="off">
      <label class="label" for="li-acc">帳號</label><input id="li-acc" name="account" class="in mono" required>
      <label class="label" for="li-pw">密碼</label><input id="li-pw" name="pw" type="password" class="in" required>
      <button class="btn primary">登入</button></form>`);
}
function viewMe(){
  const u=S.user;
  return `<div class="split"><section class="panel"><h2>我的帳號</h2>
    <dl class="dl"><div><dt>帳號</dt><dd class="mono">${esc(u.account)}</dd></div><div><dt>姓名</dt><dd>${esc(u.name)}</dd></div>
      <div><dt>角色</dt><dd>${esc(u.roleName)}</dd></div><div><dt>可管理的公司</dt><dd>${esc(u.companies.join("、"))}</dd></div></dl></section>
    <section class="panel"><h2 style="margin-bottom:12px">修改密碼</h2>${chpwForm()}</section></div>`;
}

/* ---------- 課程 ---------- */
const courseSites = c => [c.host, ...(c.sites||[])].filter((v,i,a)=>v && a.indexOf(v)===i);
function viewCourses(){
  if (S.editing) return viewCourseForm();
  const cs=S.data.courses.slice().sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start));
  if (!cs.length) return `<div class="panel"><div class="empty"><div style="display:flex;justify-content:center;margin-bottom:6px">${ill("book",80)}</div>
      <h3>${isHr()?"還沒有任何課程":"你管理的公司目前沒有課程"}</h3><p>先建立一堂課，系統會產生該堂課的簽到 QR Code。${isHr()?"<br>想先看看流程，可以載入示範資料（台北漢來 8 位示範學員＋今天一堂課）。":""}</p>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn primary" data-act="new-course">建立課程</button>
      ${isHr()?`<button class="btn" data-act="seed-demo">載入示範資料</button>`:""}</div></div></div>`;
  if (!S.selected || !cs.find(c=>c.id===S.selected)){ S.selected=(cs.find(c=>c.status==="open")||cs[0]).id; S.detail=null; loadDetail(S.selected).then(renderAdmin).catch(()=>{}); }
  const groups={open:[],upcoming:[],ended:[]}; cs.forEach(c=>groups[c.status].push(c)); groups.upcoming.reverse();
  const item=c=>`<button class="citem" data-sel="${c.id}" aria-current="${c.id===S.selected}">
      <span class="t">${esc(c.name)}</span>
      <span class="m">${esc(c.date)} ${esc(c.start)}｜${esc(c.host)}${c.sites.length?" 等 "+courseSites(c).length+" 家":""}${c.regOpen?`｜報名 ${c.regCount}${c.capacity?"/"+c.capacity:""}${c.waitCount?"＋候補 "+c.waitCount:""}`:""}${c.exportedAt?"｜已匯出":""}</span>
      <span class="n"><b>${c.count}${c.expected?`<small style="font-size:12px;color:var(--muted)">/${c.expected}</small>`:""}</b>人</span></button>`;
  const grp=(k,l)=>groups[k].length?`<div class="group-h">${l}</div>${groups[k].map(item).join("")}`:"";
  return `<div class="split">
    <section class="panel" style="padding:10px">
      <div class="panel-head" style="padding:6px 6px 0"><h2>課程</h2><button class="btn primary sm" data-act="new-course">＋ 建立課程</button></div>
      <div class="clist">${grp("open","簽到中")}${grp("upcoming","即將開始")}${grp("ended","已結束")}</div>
      <div class="stack" style="gap:6px;padding:14px 6px 4px;border-top:1px solid var(--line);margin-top:8px">
        <div class="label">報名專區（列出所有開放報名中的課程，可貼公告或 LINE 群組）</div>
        <div class="linkbox"><code>${esc(REG_URL)}</code><button class="btn sm" data-copy="${esc(REG_URL)}">複製</button></div></div>
    </section>
    ${S.detail && S.detail.course.id===S.selected ? viewCourseDetail() : `<section class="panel"><div class="empty small">載入中…</div></section>`}
  </div>`;
}
function flagsFor(s, c, list, expSet, waitSet){
  const f=[]; const late = s.at.slice(0,10)===c.date ? minOf(s.at.slice(11,16))-minOf(c.start) : 0;
  if (late>0) f.push(`<span class="chip warn">遲到 ${late} 分</span>`);
  if (s.site && !courseSites(c).includes(s.site)) f.push(`<span class="chip brass">跨館</span>`);
  if (s.method==="manual") f.push(`<span class="chip">補登${s.by?"："+esc(s.by):""}</span>`);
  if (waitSet && waitSet.has(s.emp)) f.push(`<span class="chip brass">候補</span>`);
  else if (expSet.size && !expSet.has(s.emp)) f.push(`<span class="chip brass">名單外</span>`);
  if (s.deviceId && list.filter(x=>x.deviceId===s.deviceId).length>1) f.push(`<span class="chip bad">同裝置多人</span>`);
  return {html:f.join(" "), late:Math.max(0,late)};
}
function viewCourseDetail(){
  const d=S.detail, c=d.course, list=d.signins, can=d.canEdit;
  const expSet=new Set(d.expected.map(x=>x.emp)); const signed=new Set(list.map(s=>s.emp));
  const waitSet=new Set((d.regs||[]).filter(r=>r.status==="wait").map(r=>r.emp));
  const missing=d.expected.filter(x=>!signed.has(x.emp));
  const lateN=list.filter(s=>flagsFor(s,c,list,expSet,waitSet).late>0).length;
  const rows=list.map((s,i)=>`<tr><td class="num muted">${i+1}</td><td class="mono">${esc(s.emp)}</td><td>${esc(s.name)}</td><td>${esc(s.dept)}</td><td>${esc(s.site)}</td>
      <td class="mono">${esc(s.at.slice(11,16))}</td><td>${flagsFor(s,c,list,expSet,waitSet).html}</td>
      <td>${can?`<button class="btn sm danger" data-del-signin="${esc(s.emp)}">移除</button>`:""}</td></tr>`).join("");
  return `<section class="panel">
    <div class="panel-head">
      <div><div class="row">${STATUS_CHIP[c.status]}${c.exportedAt?'<span class="chip brass">已匯出</span>':""}<span class="label">主辦：${esc(c.host)}${c.sites.length?"｜參訓："+esc(c.sites.join("、")):""}</span></div>
      <h2 style="font-size:20px;margin-top:6px">${esc(c.name)}</h2></div>
      ${can?`<div class="row"><button class="btn" data-act="edit-course">編輯</button><button class="btn danger" data-act="del-course">刪除課程</button></div>`:`<span class="chip">參訓公司：可查看與補登</span>`}
    </div>
    <dl class="dl">
      <div><dt>訓練日期</dt><dd class="mono">${esc(c.date)}</dd></div>
      <div><dt>上課時間</dt><dd class="mono">${esc(c.start)}–${esc(c.end)}</dd></div>
      <div><dt>簽到開放</dt><dd class="mono">${esc(c.signFrom)}–${esc(c.signTo)}</dd></div>
      <div><dt>訓練項目</dt><dd>${esc(c.itemCode)} ${esc((S.data.items.find(i=>i[0]===c.itemCode)||[])[1]||"")}</dd></div>
      <div><dt>內外訓</dt><dd>${c.inOuter==="1"?"外訓":"內訓"}</dd></div>
      <div><dt>講師</dt><dd>${esc(c.teacher)}</dd></div>
      <div><dt>時數／學分</dt><dd class="mono">${esc(c.hours)} 小時／${esc(c.credit)}</dd></div>
      <div><dt>簽到碼</dt><dd class="mono">${esc(d.code)}</dd></div>
    </dl>
    ${viewRegs(d, signed, can)}
    ${c.regOpen?`<div class="panel-head" style="margin-top:26px;margin-bottom:0;padding-top:18px;border-top:1px solid var(--line)"><h2>課堂簽到</h2></div>`:""}
    <div class="stat-row">${d.expected.length?`<div class="stat"><b>${d.expected.length}</b><span>應到</span></div>`:""}
      <div class="stat"><b>${list.length}</b><span>已簽到</span></div>
      ${d.expected.length?`<div class="stat"><b style="color:var(--bad)">${missing.length}</b><span>未到</span></div><div class="stat"><b>${list.filter(s=>!expSet.has(s.emp)&&!waitSet.has(s.emp)).length}</b><span>名單外</span></div>`:""}
      <div class="stat"><b>${lateN}</b><span>遲到</span></div></div>
    <div class="stack" style="margin-top:16px">
      <div class="label">教室投影頁（在教室電腦開這個連結，投到螢幕上，不需要登入）</div>
      <div class="linkbox"><code>${esc(d.projUrl)}</code>
        <button class="btn sm" data-copy="${esc(d.projUrl)}">複製連結</button>
        <button class="btn sm primary" data-act="proj-here">開啟投影畫面</button></div>
      <div class="small muted">在這台電腦按「開啟投影畫面」，或把連結傳到教室電腦打開都可以，不需要登入。</div>
      <div class="row">
        <button class="btn sm" data-act="download-qr">下載 QR Code 圖檔</button>
        ${can?`${c.status!=="open"?`<button class="btn sm" data-override="open">立即開放簽到</button>`:`<button class="btn sm" data-override="closed">結束簽到</button>`}${c.override?`<button class="btn sm" data-override="">恢復依時段開放</button>`:""}`:""}
        <span class="small muted">${c.override?"目前為手動控制":"依簽到開放時段自動開關"}</span>
      </div>
    </div>
    <div class="qr-preview">
      <img id="qr-preview" alt="簽到 QR Code 圖卡" src="">
      <div class="stack small">
        <b style="font-size:15px">簽到 QR Code 圖卡</b>
        <span class="muted">可以列印張貼在教室門口或桌上，學員掃描後輸入工號即可簽到。QR Code 只在簽到時段內有效。</span>
        <span class="muted">按「下載 QR Code 圖檔」沒有反應時：在圖片上按右鍵 →「另存圖片」，或直接拖曳到桌面。</span>
        <span>簽到碼 <b class="mono" style="font-size:18px">${esc(d.code)}</b></span>
      </div>
    </div>
    ${viewExpected(d, missing, can)}
    <div class="panel-head" style="margin-top:22px;margin-bottom:0"><h2>簽到名單</h2>
      <div class="row">
        <button class="btn sm" data-act="export-one-detail" ${list.length?"":"disabled"}>匯出簽到明細</button>
        ${isHr()?`<button class="btn sm primary" data-act="export-one-import" ${list.length?"":"disabled"}>匯出人資系統匯入檔</button>`:""}</div>
      <form class="row" data-form="manual" autocomplete="off">
        <input class="in mono" id="manual-emp" name="emp" placeholder="輸入工號補登" style="width:150px">
        <button class="btn sm">補登簽到</button></form></div>
    ${list.length?`<div class="tbl-wrap"><table><thead><tr><th class="num">#</th><th>工號</th><th>姓名</th><th>部門</th><th>公司別</th><th>簽到</th><th>註記</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      :`<div class="empty small">還沒有人簽到。開放時段內，學員掃投影頁上的 QR Code 就會出現在這裡。</div>`}
  </section>`;
}
function viewRegs(d, signed, can){
  const c=d.course;
  if (!c.regOpen) return can?`<p class="small muted" style="margin:18px 0 0">這堂課沒有開放線上報名。需要的話按上方「編輯」→「課程報名」選「開放報名」。</p>`:"";
  const regs=d.regs||[];
  const state = c.regState==="open" ? `<span class="chip open">報名中</span>` : `<span class="chip">報名已截止</span>`;
  const rows=regs.map(r=>`<tr><td class="num muted">${r.status==="ok"?r.pos:""}</td><td class="mono">${esc(r.emp)}</td><td>${esc(r.name)}</td><td>${esc(r.dept)}</td><td>${esc(r.site)}</td>
      <td class="mono">${esc(r.at.slice(5,16))}</td>
      <td>${r.status==="ok"?'<span class="chip open">正取</span>':`<span class="chip brass">候補 ${r.pos}</span>`}${signed.has(r.emp)?' <span class="chip">已簽到</span>':""}</td>
      <td class="small muted">${r.by?"代報："+esc(r.by):"本人"}</td>
      <td><button class="btn sm danger" data-cancel-reg="${esc(r.emp)}">取消報名</button></td></tr>`).join("");
  return `<div class="panel-head" style="margin-top:22px;margin-bottom:0"><h2>報名名單</h2>
      <form class="row" data-form="reg-add" autocomplete="off"><input class="in mono" name="emp" placeholder="輸入工號代為報名" style="width:170px"><button class="btn sm">代為報名</button></form></div>
    <div class="row" style="margin-top:4px">${state}<span class="small muted">截止 <span class="mono">${esc(c.regDeadline)}</span>｜${c.capacity?`名額 ${c.capacity} 人`:"不限名額"}</span></div>
    <div class="stat-row"><div class="stat"><b>${c.regCount}${c.capacity?`<small style="font-size:14px;color:var(--muted)">/${c.capacity}</small>`:""}</b><span>正取</span></div>
      <div class="stat"><b>${c.waitCount}</b><span>候補</span></div>
      ${c.capacity?`<div class="stat"><b>${Math.max(0,c.capacity-c.regCount)}</b><span>剩餘名額</span></div>`:""}</div>
    <div class="stack" style="margin-top:12px"><div class="label">這堂課的報名連結（貼到公告、LINE 群組，不需要登入）</div>
      <div class="linkbox"><code>${esc(d.regUrl)}</code><button class="btn sm" data-copy="${esc(d.regUrl)}">複製連結</button><button class="btn sm" data-act="reg-qr">下載報名 QR Code 圖檔</button></div></div>
    <div class="qr-preview">
      <img id="reg-preview" alt="報名 QR Code 圖卡" src="">
      <div class="stack small">
        <b style="font-size:15px">報名 QR Code 圖卡</b>
        <span class="muted">品牌褐灰底、上方標示「課程報名」，跟白底的簽到圖卡一眼就能分辨。可以列印張貼在布告欄，或直接把圖片傳到 LINE 群組。</span>
        <span class="muted">同仁掃描後輸入工號就能報名，截止前可以自己取消；額滿後自動排候補，有人取消時依序遞補。</span>
        <span>報名截止 <b class="mono" style="font-size:16px">${esc(c.regDeadline)}</b></span>
      </div>
    </div>
    ${regs.length?`<div class="tbl-wrap"><table><thead><tr><th class="num">#</th><th>工號</th><th>姓名</th><th>部門</th><th>公司別</th><th>報名時間</th><th>狀態</th><th>方式</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      :`<div class="empty small">還沒有人報名。</div>`}`;
}
function viewExpected(d, missing, can){
  const exp=d.expected, man=d.expectedManual||[], fromReg=exp.filter(x=>x.src==="reg").length;
  const btns = S.expEdit||!can ? "" : man.length ? `<button class="btn sm" data-act="exp-edit">修改上傳名單</button><button class="btn sm danger" data-act="exp-clear">清除上傳名單</button>`
    : exp.length ? `<button class="btn sm" data-act="exp-edit">＋ 另外上傳名單</button>` : "";
  const head=`<div class="panel-head" style="margin-top:22px;margin-bottom:0"><h2>上課名單${exp.length?`（應到 ${exp.length} 人，未到 ${missing.length} 人）`:""}</h2>
    <div class="row">${btns}</div></div>${fromReg?`<p class="small muted" style="margin:4px 0 0">應到名單＝報名正取 ${fromReg} 人${man.length?`＋上傳名單 ${man.length} 人（重複的只算一次）`:""}；候補的人不列入應到。</p>`:""}`;
  if (S.expEdit) return head+`<form data-form="expected" class="stack" style="margin-top:12px" autocomplete="off">
      <textarea id="exp-text" class="in" rows="6" style="font-family:var(--f-mono)" placeholder="貼上工號：一行一個，或用逗號、空白分隔。可以直接從 Excel 複製整欄工號貼上。">${esc(man.join("\n"))}</textarea>
      <div class="row"><span class="small muted">或上傳檔案（需有「工號」欄位）</span><input type="file" id="exp-file" accept=".xlsx,.xls,.csv" class="in" style="max-width:300px"></div>
      <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-act="exp-cancel">取消</button><button class="btn primary">儲存上課名單</button></div></form>`;
  if (!exp.length && !can) return head+`<p class="small muted" style="margin:8px 0 0">主辦公司尚未上傳上課名單。</p>`;
  if (!exp.length) return head+`<div class="exp-cta"><div><b>還沒有上課名單</b><div class="small muted">上傳這堂課應到的學員工號${d.course.regOpen?"，或等同仁線上報名":""}，就能即時看到誰還沒簽到。沒有名單也可以正常簽到。</div></div>

  if (!missing.length) return head+`<div class="empty small">應到的 ${exp.length} 人都已簽到。</div>`;

function readFile(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsArrayBuffer(file); }); }
function matchSite(v){
  v=String(v||"").trim(); if (!v) return "";
  if (S.data.sites.includes(v)) return v;
  if (/總公司/.test(v)) return "總公司";
  if (/物業|公寓|管理顧問/.test(v)) return "漢來物業";
  if (/南投|日月/.test(v)) return "漢來日月行館";
  if (/台北|臺北/.test(v)) return "台北漢來";
  if (/高雄/.test(v) || v==="漢來國際飯店股份有限公司") return "高雄漢來";
  return "";
}
async function parseRoster(){
  const file=$("#roster-file").files[0]; if (!file) return toast("請先選擇檔案");
  const fixedSite=$("#roster-site").value; let rows;
  try { const wb=XLSX.read(await readFile(file),{type:"array"}); rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""}); }
  catch { return toast("檔案讀不出來，請確認是 xlsx 或 csv"); }
  const hi=rows.findIndex(r=>r.some(v=>/工號|員編|員工編號/.test(v))); if (hi<0) return toast("找不到「工號」欄位，請確認標題列");
  const H=rows[hi].map(v=>String(v).trim()); const col=re=>H.findIndex(h=>re.test(h));
  const ci={emp:col(/工號|員編|員工編號/), n:col(/姓名/), d:col(/部門|單位/), site:col(/公司|館別|據點/)};
  if (ci.n<0) return toast("找不到「姓名」欄位");
  if (!fixedSite && ci.site<0) return toast("檔案沒有公司別欄位，請在右側選擇公司別");
  const bySite={}; let skipped=0; const sample=[];
  for (const r of rows.slice(hi+1)){
    const emp=normEmp(r[ci.emp]), n=String(r[ci.n]||"").trim(), d=ci.d>=0?String(r[ci.d]||"").trim():"";
    const site=fixedSite||matchSite(r[ci.site]);
    if (!emp && !n) continue; if (!emp||!n||!site){ skipped++; continue; }
    (bySite[site] ||= []).push({emp,n,d,site}); if (sample.length<8) sample.push({emp,n,d,site});
  }
  if (!Object.keys(bySite).length) return toast("沒有讀到可匯入的資料");
  S.rosterPreview={fileName:file.name, bySite, skipped, sample}; renderAdmin();
}

/* ---------- QR Code 圖檔 ---------- */
const CARD_SANS='"Helvetica Neue","Huninn","PingFang TC","Microsoft JhengHei",sans-serif', CARD_MONO='"IBM Plex Mono",Menlo,Consolas,monospace';
function wrapLines(g, text, maxW){ const out=[]; let cur=""; for (const ch of text){ if (g.measureText(cur+ch).width>maxW){ out.push(cur); cur=ch; } else cur+=ch; } if (cur) out.push(cur); return out; }
function drawQr(g, qr, x, y, cell){ x=Math.round(x); y=Math.round(y); const n=qr.getModuleCount(); g.fillStyle="#000000"; for (let r=0;r<n;r++) for (let k=0;k<n;k++) if (qr.isDark(r,k)) g.fillRect(x+k*cell, y+r*cell, cell, cell); }
function roundRect(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
/** 依 CI：深色底（品牌褐灰 100%）上的標誌反白 */
function whiteLogo(w, h){
  const o=document.createElement("canvas"); o.width=w; o.height=h; const x=o.getContext("2d");
  x.drawImage(logoImage,0,0,w,h); x.globalCompositeOperation="source-in"; x.fillStyle="#FFFFFF"; x.fillRect(0,0,w,h); return o;
}
function qrCardCanvas(d, mode){
  return mode==="reg" ? regCardCanvas(d) : signCardCanvas(d);
}
/* 簽到圖卡：白底、黑字 */
function signCardCanvas(d){
  const c=d.course, qr=qrcode(0,"M"); qr.addData(d.studentUrl); qr.make();
  const W=1200, H=1960, cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const g=cv.getContext("2d"), sans=CARD_SANS;
  g.fillStyle="#FFFFFF"; g.fillRect(0,0,W,H); g.strokeStyle="#E0DAD6"; g.lineWidth=4; g.strokeRect(30,30,W-60,H-60);
  const lw=300, lh=Math.round(lw*logoImage.naturalHeight/(logoImage.naturalWidth||1));
  if (logoImage.complete && logoImage.naturalWidth) g.drawImage(logoImage,(W-lw)/2,80,lw,lh);
  g.textAlign="center"; g.fillStyle="#968576"; g.font=`500 38px ${sans}`; g.fillText(`嗨！來上課｜${c.host} 課堂簽到`, W/2, 310);
  g.fillStyle="#000000"; g.font=`400 64px ${sans}`;
  let y=405; wrapLines(g, c.name, 1020).slice(0,2).forEach(l=>{ g.fillText(l,W/2,y); y+=82; });
  g.fillStyle="#6B635C"; g.font=`400 34px ${sans}`; g.fillText(`${c.date}　${c.start}–${c.end}　講師 ${c.teacher}`, W/2, y+8);
  const n=qr.getModuleCount(), cell=Math.floor(860/n), size=cell*n, qy=y+70;
  drawQr(g, qr, (W-size)/2, qy, cell);
  const by=qy+size+90;
  g.fillStyle="#6B635C"; g.font=`400 36px ${sans}`; g.fillText("簽到碼", W/2, by);
  g.fillStyle="#000000"; g.font=`600 110px ${CARD_MONO}`; g.fillText(d.code.replace(/(\d{3})(\d{3})/,"$1 $2"), W/2, by+120);
  g.fillStyle="#000000"; g.font=`500 40px ${sans}`; g.fillText("用手機相機掃描 QR Code，輸入工號完成簽到", W/2, by+215);
  g.fillStyle="#6B635C"; g.font=`400 32px ${sans}`; g.fillText(`簽到時段 ${c.signFrom}–${c.signTo}`, W/2, by+275);
  return cv;
}
/* 報名圖卡：品牌褐灰滿版底、反白標誌、「課程報名」標籤，與簽到圖卡一眼可分 */
function regCardCanvas(d){
  const c=d.course, qr=qrcode(0,"M"); qr.addData(d.regUrl); qr.make();
  const sans=CARD_SANS, W=1200, n=qr.getModuleCount(), cell=Math.floor(780/n), size=cell*n;
  const meas=document.createElement("canvas").getContext("2d"); meas.font=`400 64px ${sans}`;
  const nameLines=wrapLines(meas, c.name, 1000).slice(0,2);
  const nameTop=545, dateY=nameTop+(nameLines.length-1)*82+70, panelY=dateY+60, pad=44, panelH=size+pad*2, by=panelY+panelH+100;
  const H=by+330, cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const g=cv.getContext("2d");
  g.fillStyle="#968576"; g.fillRect(0,0,W,H);
  g.strokeStyle="rgba(255,255,255,.45)"; g.lineWidth=3; g.strokeRect(34,34,W-68,H-68);
  const lw=300, lh=Math.round(lw*logoImage.naturalHeight/(logoImage.naturalWidth||1));
  if (logoImage.complete && logoImage.naturalWidth) g.drawImage(whiteLogo(lw,lh),(W-lw)/2,86,lw,lh);
  // 標籤
  g.textAlign="center"; g.textBaseline="middle"; g.font=`400 56px ${sans}`;
  const tag="課程報名", tw=g.measureText(tag).width+150, th=104, ty=300;
  g.fillStyle="#FFFFFF"; roundRect(g,(W-tw)/2,ty,tw,th,th/2); g.fill();
  g.fillStyle="#5E5145"; g.fillText(tag, W/2, ty+th/2+2);
  g.textBaseline="alphabetic";
  g.fillStyle="rgba(255,255,255,.88)"; g.font=`400 36px ${sans}`; g.fillText(`嗨！來上課｜${c.host} 主辦`, W/2, ty+th+66);
  g.fillStyle="#FFFFFF"; g.font=`400 64px ${sans}`;
  nameLines.forEach((l,i)=>g.fillText(l, W/2, nameTop+i*82));
  g.fillStyle="rgba(255,255,255,.88)"; g.font=`400 34px ${sans}`; g.fillText(`${c.date}　${c.start}–${c.end}　講師 ${c.teacher}`, W/2, dateY);
  const pw=size+pad*2; g.fillStyle="#FFFFFF"; roundRect(g,(W-pw)/2,panelY,pw,panelH,32); g.fill();
  drawQr(g, qr, (W-size)/2, panelY+pad, cell);
  g.fillStyle="rgba(255,255,255,.88)"; g.font=`400 36px ${sans}`; g.fillText("報名截止", W/2, by);
  g.fillStyle="#FFFFFF"; g.font=`600 92px ${CARD_MONO}`; g.fillText(c.regDeadline.slice(5), W/2, by+110);
  g.font=`400 42px ${sans}`; g.fillText("用手機相機掃描 QR Code，輸入工號完成報名", W/2, by+200);
  g.fillStyle="rgba(255,255,255,.88)"; g.font=`400 32px ${sans}`; g.fillText(c.capacity?`名額 ${c.capacity} 人，額滿後可報名候補`:"不限名額", W/2, by+262);
  return cv;
}
function qrPreviewUrl(d, mode){
  const c=d.course, key=[mode||"sign",c.id,d.code,c.name,c.date,c.start,c.end,c.signFrom,c.signTo,c.teacher,c.host,c.regDeadline,c.capacity].join("|");
  S.qrCache ||= {};
  if (!S.qrCache[key]){ try { const u=qrCardCanvas(d, mode).toDataURL("image/png"); if (!logoImage.complete) return u; S.qrCache[key]=u; } catch(e){ return ""; } }
  return S.qrCache[key];
}
async function downloadQr(btn, mode){
  const d=S.detail, c=d.course;
  await act(btn, async()=>{
    try { await document.fonts.ready; } catch {}
    if (!logoImage.complete) await new Promise(r=>{ logoImage.onload=r; logoImage.onerror=r; });
    const cv=qrCardCanvas(d, mode);
    const blob=await new Promise(res=>cv.toBlob(res,"image/png"));
    downloadBlob(blob, safeName(`${mode==="reg"?"報名":"簽到"}QR_${c.host}_${c.date.replace(/\//g,"")}_${c.name.slice(0,20)}.png`));
    toast(mode==="reg"?"已下載報名 QR Code 圖檔":"如果沒有開始下載，請在下方 QR Code 圖片上按右鍵 →「另存圖片」");
  });
}

function armThen(btn, fn){
  if (btn.classList.contains("armed")){ btn.classList.remove("armed"); fn(); return; }
  const old=btn.textContent; btn.classList.add("armed"); btn.textContent="再按一次確認";
  setTimeout(()=>{ if (btn.isConnected && btn.classList.contains("armed")){ btn.classList.remove("armed"); btn.textContent=old; } },3000);
}

    const r=await api("login", v.account, v.pw).catch(err=>{ throw new Error(errMsg(err)); });
    S.token=r.token; lsSet("hl-token", r.token); S.user=r.user; await refresh(); renderAdmin(); });
  if (kind==="chpw") return act(btn, async()=>{
    if (v.pw!==v.pw2) throw new Error("兩次輸入的新密碼不一樣");
    S.user=await call("changePassword", v.old, v.pw); await refresh(); renderAdmin(); toast("密碼已更新"); });
  if (kind==="course") return act(btn, async()=>{
    if (minOf(v.signTo)<minOf(v.signFrom)) throw new Error("簽到截止時間要晚於開放時間");
    const regDeadline = v.regOpen==="1" ? `${fromInputDate(v.regDate)} ${v.regTime}` : "";
    if (v.regOpen==="1"){
      if (!v.regDate || !v.regTime) throw new Error("請填寫報名截止的日期與時間");
      if (regDeadline > `${fromInputDate(v.date)} ${v.start}`) throw new Error("報名截止時間不能晚於開課時間");
      const nowStr = (()=>{ const t=new Date(); return `${t.getFullYear()}/${pad(t.getMonth()+1)}/${pad(t.getDate())} ${pad(t.getHours())}:${pad(t.getMinutes())}`; })();
      if (regDeadline < nowStr && regDeadline !== S.editing.regDeadline) throw new Error("報名截止時間已經過了，請改成之後的時間");
    }
    const d={ id:S.editing.id||"", host:v.host, sites:fd.getAll("sites").filter(x=>x!==v.host), name:v.name, itemCode:v.itemCode, inOuter:v.inOuter, teacher:v.teacher,
      date:fromInputDate(v.date), start:v.start, end:v.end, hours:v.hours, credit:v.credit||0, signFrom:v.signFrom, signTo:v.signTo,
      regOpen:v.regOpen==="1"?"1":"", capacity:v.capacity||"", regDeadline };
    const id=await call("saveCourse", d); S.selected=id; S.editing=null; S.detail=null; await refresh(); renderAdmin(); toast(d.id?"已儲存":"課程已建立"); });
  if (kind==="reg-add") return act(btn, async()=>{ const emp=normEmp(v.emp); if (!emp) return; const r=await call("adminAddReg", S.selected, emp); await refresh(); renderAdmin(); toast(r.status==="ok"?`已幫 ${r.name} 報名`:`${r.name} 已列入候補第 ${r.pos} 位`); });
  if (kind==="manual") return act(btn, async()=>{ const emp=normEmp(v.emp); if (!emp) return; const n=await call("manualSign", S.selected, emp); await refresh(); renderAdmin(); toast(`已補登 ${n}`); });
  if (kind==="expected") return act(btn, async()=>{
    let tokens=$("#exp-text").value.split(/[\s,，、;；]+/);
    const file=$("#exp-file").files[0];
    if (file){ const wb=XLSX.read(await readFile(file),{type:"array"}); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""});
      const hi=rows.findIndex(r=>r.some(x=>/工號|員編|員工編號/.test(x))); const ci=hi>=0?rows[hi].findIndex(x=>/工號|員編|員工編號/.test(x)):0;
      tokens=tokens.concat(rows.slice(hi+1).map(r=>r[ci])); }
    const r=await call("setExpected", S.selected, tokens.map(normEmp).filter(Boolean));
    S.expEdit=false; await refresh(); renderAdmin(); toast(`上課名單已儲存 ${r.count} 人${r.unknown?`，其中 ${r.unknown} 個工號在職名單查無`:""}`); });
  if (kind==="lookup") return act(btn, async()=>{ const p=await call("lookupRoster", v.emp); $("#lookup-out").textContent=p?`${p.name}｜${p.site}${p.dept?"｜"+p.dept:""}`:"查無此工號"; });
  if (kind==="roster-q") return act(btn, async()=>{ S.rosterQ=v.q; S.rosterRows=await call("viewRoster", S.rosterView, v.q); renderAdmin(); });
  if (kind==="admin") return act(btn, async()=>{
    const d=S.adminEdit;
    const r=await call("saveAdmin", { isNew:!!d.isNew, account:d.isNew?v.account:d.account, name:v.name, role:v.role, companies:fd.getAll("companies"), active:v.active!=="0" });
    S.adminEdit=null; S.admins=await call("listAdmins");
    if (r.tempPassword) S.tempPw={account:r.account, name:v.name, pw:r.tempPassword}; else toast("已儲存");
    renderAdmin(); });
});

/* ===== 路由（放在最後，確保上面的設定都已載入） ===== */
if (PARAMS.page==="admin") startAdmin();
else if (PARAMS.page==="proj") startProjector(PARAMS.c, PARAMS.pt);
else if (PARAMS.page==="reg") PARAMS.c ? startReg(PARAMS.c) : startRegList();
else if (PARAMS.c && PARAMS.k) startStudent(PARAMS.c, PARAMS.k);
else startLanding();
</script>

</body>
</html>
